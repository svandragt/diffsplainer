[project]
name = "fearful-owl"
version = "0.1.0"
description = "GitHub PR review app: diff chunks with aligned explanations from Claude Code"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
fearful-owl = "fearful_owl.server:main"

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
