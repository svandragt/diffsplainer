[project]
name = "diffsplainer"
version = "0.1.0"
description = "GitHub PR review app: diff chunks with aligned explanations from Claude Code"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = []
authors = [{ name = "Sander van Dragt", email = "sander@vandragt.com" }]
keywords = ["github", "pull-request", "code-review", "claude", "diff"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/svandragt/diffsplainer"
Repository = "https://github.com/svandragt/diffsplainer"
Issues = "https://github.com/svandragt/diffsplainer/issues"

[project.scripts]
diffsplainer = "diffsplainer.server:main"

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
