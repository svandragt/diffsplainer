<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Cstyle%3E@media%20(prefers-color-scheme:%20dark){.bg{fill:%23a371f7}}%3C/style%3E%3Crect%20class='bg'%20width='32'%20height='32'%20rx='6'%20fill='%236639ba'/%3E%3Cg%20fill='%23fff'%3E%3Crect%20x='5'%20y='8.5'%20width='6'%20height='3'/%3E%3Crect%20x='6.5'%20y='7'%20width='3'%20height='6'/%3E%3Crect%20x='14'%20y='8.5'%20width='13'%20height='3'/%3E%3Crect%20x='5'%20y='20.5'%20width='6'%20height='3'/%3E%3Crect%20x='14'%20y='20.5'%20width='13'%20height='3'/%3E%3C/g%3E%3C/svg%3E">
  <title>Diffsplainer · PR review</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="bar">
    <a class="brand" href="/">🦉 Diffsplainer</a>
    <form id="load">
      <input id="url" type="text" placeholder="https://github.com/owner/repo/pull/123" autocomplete="off" spellcheck="false">
      <label title="How many related merged PRs to give Claude as context">
        Prev PRs <input id="prs" type="number" min="0" max="10" value="3">
      </label>
      <button type="submit">Explain</button>
    </form>
  </header>

  <main id="app">
    <section class="empty">
      <h1>Explain a pull request</h1>
      <p>Paste a GitHub PR URL above, or swap <code>github.com</code> for this host in the address bar:</p>
      <p><code><span class="host"></span>/owner/repo/pull/123</code></p>
      <p>Or drag <a id="bookmarklet" class="bookmarklet" href="#">Diffsplain</a> to your bookmarks bar, then click it on any GitHub pull request.</p>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
